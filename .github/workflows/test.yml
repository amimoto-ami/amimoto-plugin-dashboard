name: Test plugin
on:
  push:
    tags-ignore:
      - "*"
  pull_request:

jobs:
  wp-versions:
    name: Resolve WordPress versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      # 最新の WordPress とその 2 つ前のメジャーバージョンまでをテスト対象とする
      - name: Fetch latest 3 major versions from api.wordpress.org
        id: resolve
        run: |
          versions=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ \
            | jq -c '[.offers[].version | split(".")[0:2] | join(".")]
              | unique_by(split(".") | map(tonumber))
              | sort_by(split(".") | map(tonumber)) | reverse | .[0:3]')
          echo "WordPress versions: ${versions}"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  test:
    needs: wp-versions
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }} Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']
        wp: ${{ fromJSON(needs.wp-versions.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@master
        
      - name: PHP ${{ matrix.php }} Test
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli
          ini-values: post_max_size=256M, short_open_tag=On
          coverage: xdebug
          tools: composer:v2
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          
      - name: Ensure Yarn is installed
        run: |
          if ! command -v yarn &> /dev/null; then
            echo "Yarn not found, installing..."
            npm install -g yarn
          fi
          yarn --version
          
      - name: Install plugin dependencies for PHP 7.4
        if: ${{ matrix.php == '7.4' }}
        run: |
          cp composer-php7.json composer.json
          composer update --optimize-autoloader --prefer-dist
          
      - name: Install plugin dependencies for PHP 8.x
        if: ${{ matrix.php != '7.4' }}
        run: |
          composer install --optimize-autoloader --prefer-dist
          
      - name: Start WP-ENV
        uses: godaddy-wordpress/setup-wp-env@v1
        with:
          core: 'WordPress/WordPress#${{ matrix.wp }}-branch'
          phpVersion: '${{ matrix.php }}'
        
      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-
      
      - name: Run tests with PHPUnit 
        run: |
          yarn test
